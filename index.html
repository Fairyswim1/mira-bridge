le"><button class="dialog-close" data-close>닫기 ×</button><section class="collection"><h2 id="collection-title">별빛 연못</h2><p id="collection-text"></p><div id="rewards"></div><a href="assessment/">내가 알아낸 것 ↗</a></section></dialog><dialog id="settings-dialog" aria-labelledby="settings-title"><button class="dialog-close" data-close>닫기 ×</button><h2 id="settings-title">소리 설정</h2><div class="sound-controls"><button id="sound">효과음 켜기</button><button id="sound-test">소리 확인</button></div><p id="sound-status" hidden role="status"></p></dialog><script type="module" src="app.mjs"></script><script type="module" src="music.mjs"></script></body></html>
